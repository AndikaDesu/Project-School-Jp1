<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2000" width="2000" height="2000" role="img" aria-label="Adventure Ahead logo">
  <defs>
    <!-- Color palette -->
    <linearGradient id="g_mountain" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#2C6E49" />
      <stop offset="100%" stop-color="#1F5B3A" />
    </linearGradient>
    <linearGradient id="g_river" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#8FD1FF" />
      <stop offset="100%" stop-color="#3AA0FF" />
    </linearGradient>
    <linearGradient id="g_balloon" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFB37A" />
      <stop offset="100%" stop-color="#FF8A4A" />
    </linearGradient>
    <linearGradient id="g_beige" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#F6EEE0" />
      <stop offset="100%" stop-color="#E9D6B3" />
    </linearGradient>

    <!-- Subtle concrete texture using turbulence -->
    <filter id="concrete" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" result="noiseGray" />
      <feComponentTransfer in="noiseGray" result="noiseLevels">
        <feFuncA type="table" tableValues="0 0.08" />
      </feComponentTransfer>
      <feBlend mode="overlay" in2="SourceGraphic" />
    </filter>

    <!-- Soft shadow for circle -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="30" flood-color="#0b2540" flood-opacity="0.12" />
    </filter>

    <!-- Small stroke style -->
    <style type="text/css"><![CDATA[
      .headline { font-family: 'Montserrat', 'Lato', Arial, sans-serif; font-weight: 800; letter-spacing: 0.08em; }
      .tagline { font-family: 'Lato', Arial, sans-serif; font-weight: 500; letter-spacing: 0.08em; }
    ]]></style>
  </defs>

  <!-- Background subtle concrete -- put behind as light gray rectangle -->
  <rect width="100%" height="100%" fill="#f4f5f6" />
  <g filter="url(#concrete)"></g>

  <!-- Main circular badge -->
  <g transform="translate(1000,850)">
    <!-- outer subtle ring -->
    <circle r="660" fill="#ffffff" stroke="#E6E6E6" stroke-width="6" filter="url(#softShadow)" />

    <!-- inner beige disc to give premium touch -->
    <circle r="540" fill="url(#g_beige)" />

    <!-- Graphic elements group centered above text -->
    <g transform="translate(0,-120)">
      <!-- Mountains -->
      <g transform="translate(-120,-60)">
        <polygon points="-380,160 -120,-160 140,160" fill="url(#g_mountain)" />
        <polygon points="-160,160 40,-80 240,160" fill="#2C6E49" opacity="0.9" />
        <!-- Snow cap accents -->
        <path d="M -120 -160 L -90 -120 L -60 -160 Z" fill="#F6EEE0" opacity="0.6" />
        <path d="M 40 -80 L 70 -50 L 100 -80 Z" fill="#F6EEE0" opacity="0.6" />
      </g>

      <!-- River flowing from center to bottom (stylized) -->
      <path d="M -20,40 C 60,100 140,180 280,360" stroke="url(#g_river)" stroke-width="48" stroke-linecap="round" fill="none" stroke-linejoin="round" />
      <path d="M -40,60 C 40,120 120,200 240,360" stroke="#8FD1FF" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.9" />

      <!-- Hot air balloon on the right upper side -->
      <g transform="translate(220,-90)">
        <ellipse cx="0" cy="0" rx="56" ry="74" fill="url(#g_balloon)" stroke="#ffffff" stroke-width="4" />
        <rect x="-18" y="82" width="36" height="26" rx="6" fill="#6B3F2F" />
        <path d="M -12 52 C -12 62 -6 70 -6 82" stroke="#6B3F2F" stroke-width="3" fill="none" />
        <path d="M 12 52 C 12 62 6 70 6 82" stroke="#6B3F2F" stroke-width="3" fill="none" />
        <!-- Balloon stripe -->
        <path d="M -28 -20 C -10 10 10 10 28 -20" stroke="#FF8A4A" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.9" />
      </g>

      <!-- Palm trees on the left lower side (stylized) -->
      <g transform="translate(-330,40) scale(0.9)">
        <!-- trunk -->
        <path d="M -6 0 C -2 40 10 80 10 120" stroke="#8B5E3C" stroke-width="14" stroke-linecap="round" fill="none" transform="translate(28,40) rotate(-24)" />
        <!-- leaves -->
        <g transform="translate(20,20)">
          <path d="M 0 0 C -40 -18 -80 -10 -120 -34" stroke="#2C6E49" stroke-width="10" fill="none" stroke-linecap="round" />
          <path d="M 0 0 C 30 -20 72 -10 100 -26" stroke="#2C6E49" stroke-width="10" fill="none" stroke-linecap="round" />
          <path d="M 0 0 C -20 -6 -40 -2 -60 -16" stroke="#2C6E49" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.9" />
        </g>
      </g>

    </g>

    <!-- Text: primary and tagline, placed below graphic inside circle -->
    <g transform="translate(0,620)">
      <text x="0" y="0" text-anchor="middle" class="headline" font-size="86" fill="#0B2540">ADVENTURE AHEAD</text>
      <text x="0" y="72" text-anchor="middle" class="tagline" font-size="36" fill="#4B6278">Explore the World</text>
    </g>

  </g>

  <!-- Small export-friendly margin background frame -->
  <rect x="30" y="30" width="1940" height="1940" fill="none" stroke="#e9eef3" stroke-width="1" opacity="0.08" />
</svg>
