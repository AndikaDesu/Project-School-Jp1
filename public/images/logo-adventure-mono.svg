<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2000" width="2000" height="2000" role="img" aria-label="Adventure Ahead logo - mono variant">
  <defs>
    <style type="text/css"><![CDATA[
      .headline { font-family: 'Montserrat', 'Lato', Arial, sans-serif; font-weight: 800; letter-spacing: 0.08em; }
      .tagline { font-family: 'Lato', Arial, sans-serif; font-weight: 500; letter-spacing: 0.08em; }
      .mono { fill: none; stroke: #0B2540; stroke-width: 28; stroke-linecap: round; stroke-linejoin: round; }
    ]]></style>
  </defs>

  <rect width="100%" height="100%" fill="#f7f7f7" />

  <g transform="translate(1000,850)">
    <circle r="660" fill="#ffffff" stroke="#e8eef3" stroke-width="6" />
    <circle r="540" fill="#ffffff" />

    <g transform="translate(0,-120)">
      <g transform="translate(-120,-60)">
        <polygon points="-380,160 -120,-160 140,160" class="mono" />
        <polygon points="-160,160 40,-80 240,160" class="mono" />
      </g>
      <path d="M -20,40 C 60,100 140,180 280,360" class="mono" stroke-width="34" />
      <g transform="translate(220,-90)">
        <ellipse cx="0" cy="0" rx="56" ry="74" class="mono" stroke-width="20" />
        <rect x="-18" y="82" width="36" height="26" rx="6" fill="#0B2540" />
      </g>
      <g transform="translate(-330,40) scale(0.9)">
        <path d="M -6 0 C -2 40 10 80 10 120" class="mono" stroke-width="20" transform="translate(28,40) rotate(-24)" />
      </g>
    </g>

    <g transform="translate(0,620)">
      <text x="0" y="0" text-anchor="middle" class="headline" font-size="86" fill="#0B2540">ADVENTURE AHEAD</text>
      <text x="0" y="72" text-anchor="middle" class="tagline" font-size="36" fill="#4B6278">Explore the World</text>
    </g>
  </g>
</svg>