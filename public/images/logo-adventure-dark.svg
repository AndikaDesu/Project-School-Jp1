<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2000" width="2000" height="2000" role="img" aria-label="Adventure Ahead logo - dark variant">
  <defs>
    <linearGradient id="g_mountain" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#13432A" />
      <stop offset="100%" stop-color="#0B3521" />
    </linearGradient>
    <linearGradient id="g_river" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5FB0FF" />
      <stop offset="100%" stop-color="#1786FF" />
    </linearGradient>
    <linearGradient id="g_balloon" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#FF995C" />
      <stop offset="100%" stop-color="#FF6A3A" />
    </linearGradient>
    <linearGradient id="g_beige" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f3efe6" />
      <stop offset="100%" stop-color="#e6d6b3" />
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="40" flood-color="#041728" flood-opacity="0.25" />
    </filter>
    <style type="text/css"><![CDATA[
      .headline { font-family: 'Montserrat', 'Lato', Arial, sans-serif; font-weight: 800; letter-spacing: 0.08em; }
      .tagline { font-family: 'Lato', Arial, sans-serif; font-weight: 500; letter-spacing: 0.08em; }
    ]]></style>
  </defs>

  <rect width="100%" height="100%" fill="#0b1220" />

  <g transform="translate(1000,850)">
    <circle r="660" fill="#0e1623" stroke="#13212e" stroke-width="6" filter="url(#softShadow)" />
    <circle r="540" fill="url(#g_beige)" />

    <g transform="translate(0,-120)">
      <g transform="translate(-120,-60)">
        <polygon points="-380,160 -120,-160 140,160" fill="url(#g_mountain)" />
        <polygon points="-160,160 40,-80 240,160" fill="#153F2B" opacity="0.95" />
        <path d="M -120 -160 L -90 -120 L -60 -160 Z" fill="#F6EEE0" opacity="0.6" />
        <path d="M 40 -80 L 70 -50 L 100 -80 Z" fill="#F6EEE0" opacity="0.6" />
      </g>

      <path d="M -20,40 C 60,100 140,180 280,360" stroke="url(#g_river)" stroke-width="48" stroke-linecap="round" fill="none" stroke-linejoin="round" />
      <path d="M -40,60 C 40,120 120,200 240,360" stroke="#6FC3FF" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.95" />

      <g transform="translate(220,-90)">
        <ellipse cx="0" cy="0" rx="56" ry="74" fill="url(#g_balloon)" stroke="#fff" stroke-width="3" />
        <rect x="-18" y="82" width="36" height="26" rx="6" fill="#552E20" />
        <path d="M -12 52 C -12 62 -6 70 -6 82" stroke="#552E20" stroke-width="3" fill="none" />
        <path d="M 12 52 C 12 62 6 70 6 82" stroke="#552E20" stroke-width="3" fill="none" />
      </g>

      <g transform="translate(-330,40) scale(0.9)">
        <path d="M -6 0 C -2 40 10 80 10 120" stroke="#6F4A2B" stroke-width="14" stroke-linecap="round" fill="none" transform="translate(28,40) rotate(-24)" />
        <g transform="translate(20,20)">
          <path d="M 0 0 C -40 -18 -80 -10 -120 -34" stroke="#1F5B3A" stroke-width="10" fill="none" stroke-linecap="round" />
          <path d="M 0 0 C 30 -20 72 -10 100 -26" stroke="#1F5B3A" stroke-width="10" fill="none" stroke-linecap="round" />
        </g>
      </g>
    </g>

    <g transform="translate(0,620)">
      <text x="0" y="0" text-anchor="middle" class="headline" font-size="86" fill="#E8F7FF">ADVENTURE AHEAD</text>
      <text x="0" y="72" text-anchor="middle" class="tagline" font-size="36" fill="#B9D6EE">Explore the World</text>
    </g>
  </g>
</svg>